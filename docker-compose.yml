services:
  backend:
    image: garvg4278/sweet-shop-backend:v1
    container_name: sweet-shop-backend
    ports:
      - "4000:4000"
    environment:
      # Prisma / Database
      DATABASE_URL: "file:/app/data/dev.db"

      # Auth
      JWT_SECRET: "sweet-shop-prod-secret-2025"

      # One-time admin bootstrap (first admin only)
      # The FIRST user who registers with this email becomes admin
      ADMIN_BOOTSTRAP_EMAIL: "admin@sweetshop.local"

      # Runtime
      NODE_ENV: "production"
    volumes:
      - sweet-shop-db:/app/data
    restart: unless-stopped

  frontend:
    image: garvg4278/sweet-shop-frontend:v1
    container_name: sweet-shop-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sweet-shop-db:
