services:
  backend:
    image: garvg4278/sweetshop-backend:${TAG}
    container_name: backend
    env_file:
      - .env
    volumes:
      - ./backend/dev.db:/app/dev.db
    networks:
      - app-net
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: garvg4278/sweetshop-frontend:${TAG}
    container_name: frontend
    networks:
      - app-net

networks:
  app-net:
