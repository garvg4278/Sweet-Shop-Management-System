version: "3.9"

services:
  backend:
    build: ./backend
    container_name: sweet-shop-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/dev.db:/app/dev.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: sweet-shop-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
